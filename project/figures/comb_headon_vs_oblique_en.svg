<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" font-family="Helvetica,Arial,sans-serif">
<rect width="1080" height="640" fill="#f4f1eb"/>
<defs><marker id="mr" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#c8401c"/></marker><marker id="mb" markerWidth="10" markerHeight="10" refX="8" refY="3.2" orient="auto"><path d="M0,0 L8,3.2 L0,6.4 z" fill="#1e5fa8"/></marker></defs>
<rect x="207.9" y="470.0" width="84.2" height="14" fill="#333"/>
<rect x="209.9" y="150.0" width="4" height="320.0" fill="#333"/>
<rect x="286.1" y="150.0" width="4" height="320.0" fill="#333"/>
<text x="250.0" y="84.0" font-size="16" font-weight="bold" fill="#c8401c" text-anchor="middle">Light arriving head-on</text>
<text x="250.0" y="104.0" font-size="13" fill="#555" text-anchor="middle">never touches a wall, reaches the floor</text>
<line x1="250.0" y1="118.0" x2="250.0" y2="462.0" stroke="#c8401c" stroke-width="2.5" marker-end="url(#mr)"/>
<path d="M 250.0 470.0 L 211.9 150.0 L 288.1 150.0 Z" fill="#c8401c" fill-opacity="0.22"/>
<text x="250.0" y="518.0" font-size="13" fill="#c8401c" text-anchor="middle">exit seen from the floor: 6.8 deg half-angle</text>
<text x="250.0" y="548.0" font-size="21" font-weight="bold" fill="#c8401c" text-anchor="middle">only 1.4 % leaves directly</text>
<text x="250.0" y="570.0" font-size="13" fill="#666" text-anchor="middle">the other 98.6 % hits a wall</text>
<rect x="577.9" y="470.0" width="84.2" height="14" fill="#333"/>
<rect x="579.9" y="150.0" width="4" height="320.0" fill="#333"/>
<rect x="656.1" y="150.0" width="4" height="320.0" fill="#333"/>
<text x="620.0" y="84.0" font-size="16" font-weight="bold" fill="#1e5fa8" text-anchor="middle">Light arriving at 40 degrees</text>
<text x="620.0" y="104.0" font-size="13" fill="#555" text-anchor="middle">meets a wall 5.7 mm down. Never reaches the floor</text>
<line x1="620.8" y1="151.0" x2="653.1" y2="191.4" stroke="#1e5fa8" stroke-width="2.5" marker-end="url(#mb)"/>
<path d="M 658.1 195.4 L 581.9 150.0 L 658.1 150.0 Z" fill="#1e5fa8" fill-opacity="0.22"/>
<circle cx="658.1" cy="195.4" r="4.5" fill="#1e5fa8"/>
<line x1="551.9" y1="195.4" x2="658.1" y2="195.4" stroke="#1e5fa8" stroke-width="1" stroke-dasharray="3 3"/>
<text x="547.9" y="199.4" font-size="12" fill="#1e5fa8" text-anchor="end">5.7 mm</text>
<text x="620.0" y="518.0" font-size="13" fill="#1e5fa8" text-anchor="middle">exit seen from there: 40 deg half-angle</text>
<text x="620.0" y="548.0" font-size="21" font-weight="bold" fill="#1e5fa8" text-anchor="middle">41 % leaves directly</text>
<text x="620.0" y="570.0" font-size="13" fill="#666" text-anchor="middle">30 times the head-on share</text>
<line x1="151.9" y1="150.0" x2="151.9" y2="470.0" stroke="#aaa"/>
<text x="137.9" y="310.0" font-size="13" fill="#666" text-anchor="middle" transform="rotate(-90 137.9 310.0)">40 mm deep</text>
<text x="40" y="42" font-size="20" font-weight="bold" fill="#222">A honeycomb cell is a trap that opens one way</text>
<text x="40" y="66" font-size="14" fill="#555">9.53 mm cell · 40 mm deep · one cross-section. Angles are drawn true. The foil is 0.08 mm; drawn thick to be visible.</text>
<rect x="796" y="116" width="248" height="272" rx="6" fill="#e9e5dc" stroke="#d3cdc1"/>
<text x="814" y="148" font-size="15" fill="#222" font-weight="bold">Getting in is easy head-on.</text>
<text x="814" y="170" font-size="13" fill="#666">Nothing is in the way.</text>
<text x="814" y="201" font-size="15" fill="#222" font-weight="bold">Getting out is hard head-on.</text>
<text x="814" y="223" font-size="13" fill="#666">From the floor the exit is</text>
<text x="814" y="245" font-size="13" fill="#666">only 6.8 degrees wide.</text>
<text x="814" y="276" font-size="15" fill="#222" font-weight="bold">Oblique light meets a wall</text>
<text x="814" y="298" font-size="13" fill="#666">near the top, where the exit</text>
<text x="814" y="320" font-size="13" fill="#666">is wide open at 40 degrees.</text>
<text x="814" y="351" font-size="15" fill="#c8401c" font-weight="bold">Hence 5x darker head-on.</text>
</svg>
